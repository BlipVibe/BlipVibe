name: Build Android release (.aab)

# Manual trigger: Actions tab -> "Build Android release (.aab)" -> Run workflow.
# Produces a signed app bundle ready to upload to Google Play.
#
# Requires four repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  - the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Mirrors sync-app.sh: assemble www/ then copy into the android project
      - name: Build web assets
        run: |
          set -e
          npm ci
          rm -rf www && mkdir -p www
          cp index.html dmca.html changelog.json manifest.json www/
          cp -r js css images www/
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p .local-secrets
          echo "$KEYSTORE_BASE64" | base64 -d > .local-secrets/blipvibe-upload.jks
          cat > android/keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../.local-secrets/blipvibe-upload.jks
          EOF

      - name: Build signed bundle
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlipVibe-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
