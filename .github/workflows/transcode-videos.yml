name: Transcode videos

# Free video-optimization worker. Picks up posts whose video is still
# 'processing', re-encodes the raw iPhone .mov/HEVC into web-friendly
# 720p H.264 + fast-start MP4, and swaps the optimized URL back in.
#
#   schedule         -> runs the live queue every 5 min (default branch only)
#   workflow_dispatch -> manual run; use mode=backfill to fix existing videos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'process (pending queue) or backfill (existing videos)'
        type: choice
        options: [process, backfill]
        default: process
      limit:
        description: 'max videos to handle this run'
        default: '5'
      only_post_id:
        description: 'optional: a single post id to (re)process'
        default: ''

concurrency:
  group: transcode-videos
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run transcoder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'process' }}
          LIMIT: ${{ github.event.inputs.limit || '5' }}
          ONLY_POST_ID: ${{ github.event.inputs.only_post_id || '' }}
        run: node .github/scripts/transcode.mjs
